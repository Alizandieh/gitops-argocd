apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: "https://kubernetes.default.svc"
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  source:
    chart: loki
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 6.44.0
    helm:
      releaseName: loki
      valuesObject:

        gateway:
          enabled: false
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          schemaConfig:
            configs:
              - from: "2025-04-01"
                object_store: filesystem
                store: tsdb
                schema: v13
                index:
                  prefix: index_
                  period: 24h
          tableManager:
            retention_deletes_enabled: true
            retention_period: 168h
          pattern_ingester:
              enabled: true
          limits_config:
            allow_structured_metadata: true
            retention_period: 720h  # 30 days
          ruler:
            enable_api: true

        deploymentMode: SingleBinary
        singleBinary:
          replicas: 1
          persistence:
            size: 40Gi
          extraVolumes:
            - name: loki-storage
              emptyDir: {}
          extraVolumeMounts:
            - name: loki-storage
              mountPath: /loki

        chunksCache:
          enabled: false

        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0
