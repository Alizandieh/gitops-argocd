apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oauth2-proxy
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: "https://kubernetes.default.svc"
    namespace: oauth2-proxy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  source:
    chart: oauth2-proxy
    repoURL: https://oauth2-proxy.github.io/manifests
    targetRevision: 8.3.2
    helm:
      releaseName: oauth2-proxy
      valuesObject:

        config:
          existingSecret: oauth2-proxy-secret
          configFile: |
            provider = "azure"
            azure_tenant = "c80ba4fc-2d8e-4298-ae7e-85d792ba8c23"
            oidc_issuer_url = "https://login.microsoftonline.com/c80ba4fc-2d8e-4298-ae7e-85d792ba8c23/v2.0"
            email_domains = [ "*" ]
            whitelist_domains = [ ".ali-zandieh.com" ]
            cookie_domains = [ ".ali-zandieh.com" ]
            cookie_samesite = "lax"
            redirect_url = "https://auth.dev.ali-zandieh.com/oauth2/callback"
            skip_auth_preflight = true
            skip_auth_regex = ["^/api/.*$"]
            set_xauthrequest = true
            pass_authorization_header = true
            upstreams = ["static://200"]

        extraArgs:
          - --cookie-secure=false
          - --skip-provider-button
          - --ssl-insecure-skip-verify
          - --reverse-proxy

        readinessProbe:
          timeoutSeconds: 20
          periodSeconds: 30

        ingress:
          enabled: true
          className: traefik
          annotations:
            cert-manager.io/issuer: "letsencrypt-cloudflare"
            cert-manager.io/issuer-kind: "ClusterIssuer"
          hosts:
          - auth.dev.ali-zandieh.com
          tls:
          - hosts:
            - auth.dev.ali-zandieh.com
            secretName: oauth2-saha-tls

        sessionStorage:
          # Can be one of the supported session storage cookie|redis
          type: redis
          redis:
            password: "devops-oauth2"

        redis:
          enabled: true
          replicas: 2
          redisPassword: "devops-oauth2"
          persistentVolume:
            enabled: false
