apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  context: |
    argocdUrl: https://argocd.dev.ali-zandieh.com

  service.email: |
    host: email-smtp.eu-west-1.amazonaws.com
    port: 587
    username: $smtp-username
    password: $smtp-password
    from: alert@ali-zandieh.com

  # Trigger: send email when sync fails
  trigger.on-sync-failure: |
    - description: Notify when sync operation fails
      oncePer: app.status.operationState.syncResult.revision
      send: [sync-template]
      when: app.status.operationState.phase in ['Failed', 'Error']

  # Trigger: send email when pods are stuck (health degraded)
  trigger.on-health-degraded: |
    - description: Notify when app becomes unhealthy (e.g., pods crashing)
      oncePer: app.status.operationState.syncResult.revision
      send: [health-template]
      when: app.status.health.status == 'Degraded'

  # Email templates
  template.sync-template: |
    email:
      subject: Non-Prod - Application {{.app.metadata.name}} Sync Failed
    message: |
      Environment: Dev/UAT
      The ArgoCD application **{{.app.metadata.name}}** failed to sync.

      - Status: {{.app.status.operationState.phase}}
      - Message: {{.app.status.operationState.message}}
      - Dashboard URL: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}

      Auto-generated by ArgoCD Notifications.

      Regards,
      DevOps Team

  template.health-template: |
    email:
      subject: Non-Prod - Application {{.app.metadata.name}} Deployment Failed
    message: |
      Environment: Dev/UAT
      The ArgoCD application **{{.app.metadata.name}}** failed to deploy.

      - Status: {{.app.status.health.status}}
      - Dashboard URL: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}

      Auto-generated by ArgoCD Notifications.

      Regards,
      DevOps Team
