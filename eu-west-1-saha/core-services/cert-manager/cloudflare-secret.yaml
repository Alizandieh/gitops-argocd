apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-secret
  namespace: cert-manager
spec:
  refreshInterval: "2h"
  secretStoreRef:
    name: aws-secretstore
    kind: SecretStore
  target:
    name: cloudflare-secret
    creationPolicy: Owner
  data:
  - secretKey: cloudflare_api_token
    remoteRef:
      key: Cloudflare
      property: api_token
