apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: "https://kubernetes.default.svc"
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/labels
        - /metadata/annotations
  source:
    chart: kyverno
    repoURL: https://kyverno.github.io/kyverno
    targetRevision: 3.8.0
    helm:
      releaseName: kyverno
      valuesObject:

        admissionController:
          hostNetwork: true
          webhookServer:
            port: 10240
          metricsService:
            port: 8090

          startupProbe:
            httpGet:
              port: 10240
          livenessProbe:
            httpGet:
              port: 10240
          readinessProbe:
            httpGet:
              port: 10240
