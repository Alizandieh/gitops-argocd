apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: piston-pool
spec:
  template:
    metadata:
      labels:
        node-group: piston_nodes_karpenter
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: piston
      requirements:
      - key: node.kubernetes.io/instance-type
        operator: In
        values: ["t3a.medium"]
      - key: karpenter.sh/capacity-type
        operator: In
        values: ["on-demand"]
