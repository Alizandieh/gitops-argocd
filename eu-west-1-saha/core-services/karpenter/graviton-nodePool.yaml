apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: graviton4-static
spec:
  replicas: 1
  template:
    metadata:
      labels:
        node-group: saha_nodes
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: graviton4
      requirements:
      - key: kubernetes.io/arch
        operator: In
        values: ["arm64"]
      - key: node.kubernetes.io/instance-type
        operator: In
        values: ["t4g.large"]
      - key: karpenter.sh/capacity-type
        operator: In
        values: ["on-demand"]