apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: piston
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: "https://kubernetes.default.svc"
    namespace: piston
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  sources:
  - repoURL: git@github.com:Alizandieh/helm-chart.git
    targetRevision: 1.0.0
    path: generic-chart/
    helm:
      releaseName: piston
      valueFiles:
      - $values/eu-west-1-saha/apps/piston/values/piston-values.yaml
  - repoURL: 'git@github.com:Alizandieh/gitops-argocd.git'
    targetRevision: main
    ref: values
