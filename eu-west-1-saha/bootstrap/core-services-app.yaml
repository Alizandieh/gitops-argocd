apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: core
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Alizandieh/gitops-argocd.git
    targetRevision: HEAD
    path: eu-west-1-saha/core-services/
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      name: kyverno
      jsonPointers:
        - /metadata/finalizers
